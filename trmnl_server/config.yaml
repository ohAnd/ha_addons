name: "TRMNL Server"
description: "TRMNL local server to serve own BMP's directly"
version: "0.0.8-fix3"
slug: "trmnl_server"
url: "https://github.com/ohAnd/trmnlServer"
arch:
  - aarch64
  - amd64
  # - armhf # no native GitHub runner, so the BuildKit pipeline cannot build it - deprecated - https://www.home-assistant.io/blog/2025/06/11/release-20256/#deprecating-installation-methods-and-32-bit-architectures
  # - armv7 # no native GitHub runner, so the BuildKit pipeline cannot build it - deprecated - https://www.home-assistant.io/blog/2025/06/11/release-20256/#deprecating-installation-methods-and-32-bit-architectures
  # - i386 # no native GitHub runner, so the BuildKit pipeline cannot build it - deprecated - https://www.home-assistant.io/blog/2025/06/11/release-20256/#deprecating-installation-methods-and-32-bit-architectures

panel_icon: mdi:tablet-dashboard
panel_admin: false

ingress: true
ingress_port: 83
init: false

image: "ghcr.io/ohand/ha-addon-trmnl_server_{arch}"

map:
  - type: ssl
  - type: addon_config
    read_only: false
    path: /app/addon_config
host_network: true

options:
  time_zone: Europe/Berlin #your time zone. not optional.
  image_path: /addon_config/trmnlServer/screen.bmp
  image_modification: true
  refresh_time: 120
  battery_max_voltage: 4.7
  battery_min_voltage: 2.2
schema:
  time_zone: str #your time zone. not optional.
  image_path: str
  image_modification: bool
  refresh_time: int
  battery_max_voltage: float(2,5)
  battery_min_voltage: float(0.5,4)
